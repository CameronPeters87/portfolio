<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>AIP-C01 Study Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">AIP-C01 <span>Study Hub</span></div>
      <div class="countdown" id="countdown">–</div>
    </div>
    <div class="progressbar"><div class="progressbar-fill" id="overallProgress"></div></div>
  </header>

  <nav class="tabs" id="tabs">
    <a href="#home" class="tab" data-view="home">Home</a>
    <a href="#plan" class="tab" data-view="plan">Plan</a>
    <a href="#cheats" class="tab" data-view="cheats">Cheat Sheets</a>
    <a href="#cards" class="tab" data-view="cards">Flashcards</a>
    <a href="#quiz" class="tab" data-view="quiz">Quiz</a>
    <a href="#weak" class="tab" data-view="weak">Weak Areas</a>
  </nav>

  <main id="view" class="view"><!-- rendered by app.js --></main>

  <footer class="footer">
    <span>Built with Kiro · study record for AIP-C01</span>
    <button id="resetBtn" class="link-btn" type="button">Reset progress</button>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
